name: Docker
on:
  push:
    branches:
      - main
      - test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Run tests
        run: |
            set -e
            docker build . --file Dockerfile -t moaaz17877640/detect-enter-disk:v5
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker push moaaz17877640/detect-enter-disk:v5
        env:
          DOCKER_BUILDKIT: 1
